[tool.black]
line-length = 100
target-version = ["py311"]
exclude = '''
/(
  \.venv
| htmlcov
| dist
| build
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "htmlcov", "dist", "build"]
# Enable common, fast rulesets
select = [
  "E", "F",        # pycodestyle/pyflakes
  "I",             # isort
  "UP",            # pyupgrade
  "B",             # bugbear
  "SIM", "PIE",    # simplicity & best-practices
]
ignore = [
  "E203",          # black-compatible slicing
]

[tool.ruff.lint.isort]
known-first-party = ["python"]  
