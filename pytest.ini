[pytest]
# Look for tests under src/tests
testpaths = src/tests
python_files = test_*.py *_test.py
addopts = -ra

# Register custom markers
markers =
    integration: tests that hit real external services (Gemini API, etc.)

# Turn warnings into errors in tests (comment out if too strict)
filterwarnings =
    error

log_cli = true
log_cli_level = INFO
